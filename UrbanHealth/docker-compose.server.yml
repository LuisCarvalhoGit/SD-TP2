networks:
  urban-cloud:
    driver: bridge

services:
  python-analysis:
    build:
      context: ./Services
      dockerfile: Analysis/Dockerfile
    container_name: python-analysis
    env_file:
      - .env.distributed.server
    ports:
      - "${PORT_PYTHON_ANALY:-50052}:50052"
    networks:
      - urban-cloud
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 50052), 3); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  csharp-server: 
    build: 
      context: .
      dockerfile: Server/Dockerfile
    container_name: csharp-server
    env_file:
      - .env.distributed.server
    ports:
      - "${PORT_SERVER_TCP:-5001}:5001"
      - "${PORT_DASHBOARD:-8081}:8081"
      - "${PORT_SERVER_UDP:-5003}:5003/udp"
    volumes:
      - "./database_data:/app/data"
      - "./ServerConfigs:/app/Configs"
    depends_on:
      python-analysis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - urban-cloud
