networks:
  urban-edge:
    driver: bridge

x-gateway-base: &gateway-base
  build:
    context: .
    dockerfile: Gateway/Dockerfile
  env_file:
    - .env.distributed.gateway
  volumes:
    - ./GatewayConfigs:/app/Configs
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    python-preprocess:
      condition: service_healthy
  restart: unless-stopped
  networks:
    - urban-edge

services:
  python-preprocess:
    build:
      context: ./Services
      dockerfile: PreProcessing/Dockerfile
    container_name: python-preprocess
    env_file:
      - .env.distributed.gateway
    ports:
      - "${PORT_PYTHON_PRE:-50051}:50051"
    networks:
      - urban-edge
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 50051), 3); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  gateway-g101:
    <<: *gateway-base
    container_name: gateway-g101
    environment:
      - GID=G101
    ports:
      - "5004:5004/udp"
      - "8080:8080"

  gateway-g102:
    <<: *gateway-base
    container_name: gateway-g102
    environment:
      - GID=G102
    ports:
      - "5005:5004/udp"
      - "8082:8080"
