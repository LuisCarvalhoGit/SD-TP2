networks:
  urban-edge:
    driver: bridge

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "${PORT_RABBITMQ:-5672}:5672"
      - "${PORT_RABBITMQ_WEB:-15672}:15672"
    env_file:
      - .env.distributed.gateway
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    networks:
      - urban-edge
    
  python-preprocess:
    build:
      context: ./Services
      dockerfile: PreProcessing/Dockerfile
    container_name: python-preprocess
    env_file:
      - .env.distributed.gateway
    ports:
      - "${PORT_PYTHON_PRE:-50051}:50051"
    networks:
      - urban-edge
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 50051), 3); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    
  csharp-gateway:
    build: 
      context: .
      dockerfile: Gateway/Dockerfile
    container_name: csharp-gateway
    env_file:
      - .env.distributed.gateway
    volumes:
      - ./Gateway/Configs/gateway-config.json:/app/Configs/gateway-config.json
      - ./Gateway/Configs/sensors-config.json:/app/Configs/sensors-config.json
    ports:
      - "${PORT_GATEWAY_UDP:-5004}:5004/udp"
      - "${PORT_GATEWAY_WEB:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rabbitmq:
        condition: service_healthy
      python-preprocess:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - urban-edge
