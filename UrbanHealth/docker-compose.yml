networks:
  urban-net:
    driver: bridge

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "${PORT_RABBITMQ:-5672}:5672"
      - "${PORT_RABBITMQ_WEB:-15672}:15672"
    env_file:
      - .env.local
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks:
      - urban-net
    
  python-preprocess:
    build:
      context: ./Services
      dockerfile: PreProcessing/Dockerfile
    container_name: python-preprocess
    env_file:
      - .env.local
    ports:
      - "${PORT_PYTHON_PRE:-50051}:50051"
    networks:
      - urban-net
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 50051), 3); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  python-analysis:
    build:
      context: ./Services
      dockerfile: Analysis/Dockerfile
    container_name: python-analysis
    env_file:
      - .env.local
    ports:
      - "${PORT_PYTHON_ANALY:-50052}:50052"
    networks:
      - urban-net
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 50052), 3); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  csharp-server: 
    build: 
      context: .
      dockerfile: Server/Dockerfile
    container_name: csharp-server
    env_file: 
      - .env.local
    ports:
      - "${PORT_SERVER_TCP:-5001}:5001"
      - "${PORT_DASHBOARD:-8081}:8081"
      - "${PORT_SERVER_UDP:-5003}:5003/udp"
    volumes:
      - "./database_data:/app/data"
    depends_on:
      python-analysis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - urban-net
    
  csharp-gateway:
    build: 
      context: .
      dockerfile: Gateway/Dockerfile
    container_name: csharp-gateway
    env_file: 
      - .env.local
    volumes:
      - ./Gateway/Configs/gateway-config.json:/app/Configs/gateway-config.json
      - ./Gateway/Configs/sensors-config.json:/app/Configs/sensors-config.json
    ports:
      - "${PORT_GATEWAY_UDP:-5004}:5004/udp"
    depends_on:
      rabbitmq:
        condition: service_healthy
      python-preprocess:
        condition: service_healthy
      csharp-server:
        condition: service_started
    restart: unless-stopped
    networks:
      - urban-net
    
  csharp-sensor:
    build:
      context: .
      dockerfile: Sensor/Dockerfile
    container_name: csharp-sensor
    env_file: 
      - .env.local
    volumes:
      - ./Sensor/Frames:/app/Frames
      - ./SensorConfigs:/app/configs
    stdin_open: true
    tty: true
    ports:
      - "${PORT_SENSOR_UDP:-5002}:5002/udp"
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - urban-net
