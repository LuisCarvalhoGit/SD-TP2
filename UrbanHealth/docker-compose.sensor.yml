networks:
  urban-sensor:
    driver: bridge

services:
  csharp-sensor:
    build:
      context: .
      dockerfile: Sensor/Dockerfile
    container_name: csharp-sensor
    env_file:
      - .env.distributed.sensor
    volumes:
      - ./Sensor/Frames:/app/Frames
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stdin_open: true
    tty: true
    restart: unless-stopped
    networks:
      - urban-sensor
