# Host 2 (tudo junto): broker + gateways + preprocess — modo mais simples
#   docker compose -p urbanhealth -f docker-compose.host2.yml up -d --build
name: urbanhealth

networks:
  urban-edge:
    name: urbanhealth-edge

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: urbanhealth
      RABBITMQ_DEFAULT_PASS: urbanhealth
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s
    restart: unless-stopped
    networks:
      - urban-edge

  python-preprocess:
    build:
      context: ./Services
      dockerfile: PreProcessing/Dockerfile
    container_name: python-preprocess
    ports:
      - "50051:50051"
    networks:
      - urban-edge
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 50051), 3); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  gateway-g101:
    build:
      context: .
      dockerfile: Gateway/Dockerfile
    container_name: gateway-g101
    environment:
      - GID=G101
    volumes:
      - ./GatewayConfigs:/app/Configs
    ports:
      - "5004:5004/udp"
      - "8080:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      python-preprocess:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - urban-edge

  gateway-g102:
    build:
      context: .
      dockerfile: Gateway/Dockerfile
    container_name: gateway-g102
    environment:
      - GID=G102
    volumes:
      - ./GatewayConfigs:/app/Configs
    ports:
      - "5005:5004/udp"
      - "8082:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      python-preprocess:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - urban-edge
