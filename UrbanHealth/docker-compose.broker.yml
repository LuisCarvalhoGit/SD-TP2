# Host 2 (infra): start FIRST with project name "urbanhealth"
#   docker compose -p urbanhealth -f docker-compose.broker.yml up -d
name: urbanhealth

networks:
  urban-edge:
    name: urbanhealth-edge

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: urbanhealth
      RABBITMQ_DEFAULT_PASS: urbanhealth
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s
    restart: unless-stopped
    networks:
      - urban-edge
